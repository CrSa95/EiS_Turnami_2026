services:
  mongo:
    image: mongo:7.0
    container_name: turnami_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: turnami_db
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local